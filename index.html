<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>obishhh</title>
  <meta name="description" content="obishhh makes iPhone apps in New York City.">
  <meta property="og:title" content="obishhh">
  <meta property="og:description" content="Makes iPhone apps in New York City.">
  <meta property="og:url" content="https://obishhh.nyc">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23f7b500'/><text x='50' y='70' font-family='Helvetica,Arial,sans-serif' font-size='64' font-weight='800' text-anchor='middle' fill='%23111'>o</text></svg>">
  <style>
    :root {
      --bg: #fafaf7;
      --text: #141414;
      --muted: #6b6b66;
      --line: #e4e3dc;
      --accent: #f7b500;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111110;
        --text: #f2f1ec;
        --muted: #9a9993;
        --line: #2a2a27;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    main {
      flex: 1;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 18vh 24px 48px;
    }
    h1 {
      margin: 0;
      font-size: clamp(48px, 12vw, 84px);
      line-height: 1;
      letter-spacing: -0.04em;
      font-weight: 800;
    }
    h1 span { color: var(--accent); }
    .tagline {
      margin: 16px 0 56px;
      font-size: 20px;
      color: var(--muted);
    }
    h2 {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    ul { list-style: none; margin: 0 0 40px; padding: 0; }
    li { border-top: 1px solid var(--line); }
    li:last-child { border-bottom: 1px solid var(--line); }
    li a {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 0;
      color: inherit;
      text-decoration: none;
    }
    li a:hover .name { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 4px; }
    .note { color: var(--muted); text-align: right; }
    footer {
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      font-size: 14px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>obishhh<span>.</span></h1>
    <p class="tagline">Makes iPhone apps in New York City.</p>

    <h2>Apps</h2>
    <ul>
      <li><a href="https://infomercial.nyc"><span class="name">Infomercial</span><span class="note">Rate and review TV</span></a></li>
    </ul>

    <h2>Elsewhere</h2>
    <ul>
      <li><a href="https://github.com/obishhh"><span class="name">GitHub</span><span class="note">@obishhh</span></a></li>
    </ul>
  </main>
  <footer>© 2026 obishhh</footer>
</body>
</html>
