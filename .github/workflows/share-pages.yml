# Keeps a page for every published card, so a link to one shows that card in a message (see scripts/share-pages.mjs).
# Runs every ten minutes, so a card just published soon has its page and picture to save, whenever main changes, and
# by hand from the Actions tab ("Run workflow"). A run with nothing new commits nothing.
name: Share pages

on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths-ignore: ['d/**', 'c/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: share-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The newest main, not the commit that started the run: one that waited behind another starts from its pages.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install a browser to draw the cards, and pngquant to shrink the pictures to save
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends pngquant

      - name: Build the pages
        run: node scripts/share-pages.mjs

      # Pushing starts the Pages build that publishes it.
      - name: Commit what changed
        run: |
          git add -A d c
          git diff --cached --quiet && exit 0
          git config user.name "share-pages"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh share pages"
          # Main may have moved while the pages were drawn: go on top of it rather than fail the push.
          git pull --rebase
          git push
